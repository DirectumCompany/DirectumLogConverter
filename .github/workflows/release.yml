name: Publish

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: windows-latest
            target: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          release_name="DirectumLogConverter-$TAG-${{ matrix.target }}"
          # Build everything
          dotnet publish DirectumLogConverter/DirectumLogConverter.csproj --runtime "${{ matrix.target }}" -c Release -o "$release_name"
          # Pack files
          if [ "${{ matrix.target }}" == "win-x64" ]; then
            # Pack to zip for Windows
            7z a -tzip "${release_name}.zip" "./${release_name}/*"
          else
            chmod +x "$release_name/dlc"
            tar czvf "${release_name}.tar.gz" -C "$release_name" dlc
          fi
          # Delete output directory
          rm -r "$release_name"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: "DirectumLogConverter-*"
